    <body>
	<nav>
	    <a href="./index.html">Home</a>

	<div class="page-content">
	    <p class="page-title">Contact</p>
	    <h1>Get in touch</h1>
	    <p class="subtitle">Have a project in mind, want to collaborate, or just want to say hello? Send me a message.</p>

	    <form class="contact-form" action="mailto:your@email.com" method="GET">
		<div class="field">
		    <label for="name">Name</label>
		    <input type="text" id="name" name="name" placeholder="Your name" required>
		</div>
		<div class="field">
		    <label for="email">Email</label>
		    <input type="email" id="email" name="email" placeholder="your@email.com" required>
		</div>
		<div class="field">
		    <label for="message">Message</label>
		    <textarea id="message" name="body" placeholder="What's on your mind?" required></textarea>
		</div>
		<button type="submit" class="submit-btn">Send message</button>
	    </form>

	    <hr class="divider">

	    <p class="links-label">Or find me on</p>
	    <div class="contact-links">
		<a href="https://www.linkedin.com/in/britton-petersen-32b119339/" class="contact-link" target="_blank">
		    <span class="link-platform">LinkedIn</span>
		    <span class="link-handle">britton-petersen-32b119339</span>
		</a>
		<a href="https://github.com/bboycode" class="contact-link" target="_blank">
		    <span class="link-platform">GitHub</span>
		    <span class="link-handle">bboycode</span>
		</a>
		<a href="https://tryhackme.com/p/bboyhaks" class="contact-link" target="_blank">
		    <span class="link-platform">TryHackMe</span>
		    <span class="link-handle">bboyhaks</span>
		</a>
	    </div>
	</div>
    </body>
</html>
